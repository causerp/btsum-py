name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (default: v<version from btsum.py>)"
        required: false
        type: string
      draft:
        description: "Create as a draft release"
        required: false
        type: boolean
        default: false
      prerelease:
        description: "Mark as a pre-release"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: "1"

jobs:
  prepare:
    name: prepare
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - id: version
        shell: bash
        run: |
          VERSION=$(python3 -c "import btsum; print(btsum.__version__)")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version: $VERSION"
      - id: tag
        shell: bash
        run: |
          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG="v${{ steps.version.outputs.version }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "tag: $TAG"

  build:
    name: build pyz
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pytest
      - name: Run tests
        run: python -m pytest -q
      - name: Build pyz
        run: |
          mkdir -p dist
          python devscripts/make_zipapp.py dist/btsum.pyz
      - name: Smoke-test pyz
        run: |
          python dist/btsum.pyz --version
          printf 'hello btsum\n' > hello.txt
          python dist/btsum.pyz hello.txt
      - uses: actions/upload-artifact@v7
        with:
          name: btsum-pyz
          path: dist/btsum.pyz
          if-no-files-found: error
          retention-days: 7

  release:
    name: release ${{ needs.prepare.outputs.tag }}
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: btsum-pyz
          path: dist
      - name: Rename pyz with tag
        run: |
          mv dist/btsum.pyz "dist/btsum-${{ needs.prepare.outputs.tag }}.pyz"
          ls -la dist/
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: btsum ${{ needs.prepare.outputs.tag }}
          draft: ${{ inputs.draft }}
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: true
          files: dist/*.pyz
